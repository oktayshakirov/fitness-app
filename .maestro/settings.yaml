appId: com.oktayshakirov.fitness
name: M5 onboarding and profile
---
- openLink: fitness:///
- runFlow:
    when:
      visible: Get started
    commands:
      - tapOn: Get started
      - tapOn: Female model
      - tapOn: Continue
      - tapOn: Pounds
      - tapOn: Continue
      - tapOn: Start training
- assertVisible: About recovery
- tapOn: Profile
- assertVisible: Weight units
- tapOn: Female model
- tapOn: lb
- tapOn: Slow
- takeScreenshot: settings-preferences
- scrollUntilVisible:
    element: Privacy
    direction: DOWN
- tapOn: Privacy
- assertVisible: Privacy
- takeScreenshot: privacy
- tapOn: Close privacy
