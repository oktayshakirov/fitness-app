appId: com.shadev.musclepal
name: M5 onboarding and profile
---
- openLink: fitness:///
- runFlow:
    when:
      visible: Get started
    commands:
      - tapOn: Get started
      - tapOn: Female model
      - tapOn: Continue
      - tapOn: Pounds
      - tapOn: Continue
      - tapOn: Start training
- scrollUntilVisible:
    element: About recovery
    direction: UP
- tapOn: "Profile.*"
# Profile keeps its scroll position between runs.
- scrollUntilVisible:
    element: Female model
    direction: UP
- assertVisible: Weight units
- tapOn: Female model
- tapOn: lb
- scrollUntilVisible:
    element: Slow
    direction: DOWN
    centerElement: true
- tapOn: Slow
- takeScreenshot: settings-preferences
- scrollUntilVisible:
    element: Privacy
    direction: DOWN
- tapOn: Privacy
- assertVisible: Privacy
- takeScreenshot: privacy
- tapOn: Close privacy
