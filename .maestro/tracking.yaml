appId: com.oktayshakirov.fitness
name: M3 tracking and persistence
---
# Taps that raise a toast skip the settle wait: its 10 s countdown line keeps
# the screen moving, and Maestro would otherwise wait until the toast has gone.
- runFlow:
    when:
      visible: OK
    commands:
      - tapOn: OK
- runFlow:
    when:
      visible: Close log
    commands:
      - tapOn: Close log
- openLink: fitness://exercises
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- runFlow:
    when:
      visible: Clear filters
    commands:
      - tapOn: Clear filters
# The grid keeps its scroll position between runs.
- scrollUntilVisible:
    element: Log Barbell Back Squat
    direction: UP
- tapOn:
    text: Log Barbell Back Squat
    waitToSettleTimeoutMs: 500
- assertVisible: "Logged.*"
- tapOn: Undo
- tapOn:
    id: exercise-barbell_back_squat
# Pause first: on Android a playing video keeps UiAutomator from going idle, so
# every later step waits ~10 s and short-lived toasts expire before they are read.
- tapOn: Pause video
- tapOn: Log this exercise
- assertVisible: Log exercise
- tapOn:
    text: Done
    waitToSettleTimeoutMs: 500
- assertVisible: "Logged.*"
- tapOn: Close exercise
- openLink: fitness://history
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- tapOn:
    text: Edit Barbell Back Squat
    index: 0
- tapOn: Add sets
- tapOn:
    id: log-reps-0
- eraseText
- inputText: "12"
- tapOn:
    id: log-weight-0
- eraseText
- inputText: "40"
- tapOn: Done editing
- scrollUntilVisible:
    element:
      id: log-note
    direction: DOWN
- tapOn:
    id: log-note
- inputText: Native persistence check
- tapOn: Done editing
- scrollUntilVisible:
    element: Save changes
    direction: UP
- tapOn:
    text: Save changes
    waitToSettleTimeoutMs: 500
- assertVisible: Updated
- takeScreenshot: history-saved
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Profile
    timeout: 30000
- openLink: fitness://history
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- tapOn:
    text: Edit Barbell Back Squat
    index: 0
- assertVisible: "12"
- assertVisible: "40"
- assertVisible: ".*Native persistence check.*"
- scrollUntilVisible:
    element: Delete entry
    direction: DOWN
- tapOn:
    text: Delete entry
    waitToSettleTimeoutMs: 500
- assertVisible: Deleted
- tapOn: Undo
- tapOn:
    text: Edit Barbell Back Squat
    index: 0
- scrollUntilVisible:
    element: Delete entry
    direction: DOWN
- tapOn: Delete entry
