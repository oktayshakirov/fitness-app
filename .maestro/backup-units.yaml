appId: com.oktayshakirov.fitness
name: M5 imported weight and no-op unit conversion
---
- openLink: fitness://log?entryId=m5-native-backup-test
- assertVisible: Edit log
- assertVisible: "88.18"
- tapOn: Save changes
- openLink: fitness://profile
- scrollUntilVisible:
    element: kg
    direction: UP
- tapOn: kg
- openLink: fitness://log?entryId=m5-native-backup-test
# The set rows render a moment after the sheet opens.
- extendedWaitUntil:
    visible: "40"
    timeout: 10000
- tapOn: Close log
- openLink: fitness://profile
- tapOn: lb
