appId: com.oktayshakirov.fitness
name: Routines (create, start, walk through, delete)
---
# Taps that raise a toast skip the settle wait: its 10 s countdown line keeps
# the screen moving, and Maestro would otherwise wait until the toast has gone.
# Creates "Maestro routine" with two exercises and deletes it at the end.
- openLink: fitness://routine/edit
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- tapOn:
    id: routine-name
- inputText: Maestro routine
- hideKeyboard
# Exercises no other flow logs, so the routine starts at 1 of 2 whatever ran before.
- tapOn: Search exercises to add
- inputText: glute
- hideKeyboard
- tapOn: Add Glute Bridge
- tapOn: Search exercises to add
- eraseText
- inputText: hammer
- hideKeyboard
- tapOn: Add Hammer Curl
- assertVisible: In this routine (2)
- tapOn: Save routine
- assertVisible: Maestro routine
- tapOn: Start workout
- assertVisible: "Maestro routine · 1 of 2"
- tapOn: Next exercise
- assertVisible: "Maestro routine · 2 of 2"
- tapOn: Close exercise
- tapOn: Delete routine
- tapOn:
    text: Delete
    waitToSettleTimeoutMs: 500
- assertVisible: Deleted Maestro routine
