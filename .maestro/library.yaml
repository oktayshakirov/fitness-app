appId: com.oktayshakirov.fitness
name: M1 and M2 native smoke
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Toggle performance monitor"
      platform: Android
    commands:
      - back
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- openLink: "fitness://exercises"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 30000
- runFlow:
    when:
      visible: "Clear filters"
    commands:
      - tapOn: "Clear filters"
- assertVisible: "30 exercises"
- takeScreenshot: library
- tapOn: "Search exercises"
# iOS can drop keystrokes typed before the field has focus.
- waitForAnimationToEnd:
    timeout: 2000
- inputText: "barbell bench press"
- pressKey: Enter
- assertVisible: "1 exercise"
- tapOn:
    id: exercise-barbell_bench_press
- assertVisible: "1 of 1"
- assertVisible: "Pause video"
- tapOn: "Pause video"
- assertVisible: "Play video"
- tapOn: "Play video"
- assertVisible: "Pause video"
- tapOn: "Side"
# A new angle starts playing again; pause so Android's UI dumps stay quick (README).
- tapOn: "Pause video"
- takeScreenshot: detail-side
- tapOn: "Close exercise"
- tapOn: "Clear filters"
- assertVisible: "30 exercises"
- tapOn: "Barbell"
- assertVisible: "5 exercises"
- tapOn:
    id: exercise-barbell_back_squat
- tapOn: "Next exercise"
- assertVisible: "2 of 5"
- tapOn: "Previous exercise"
- assertVisible: "1 of 5"
- tapOn: "Close exercise"
- openLink: "fitness://history"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible: "Active days"
- openLink: "fitness://profile"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- scrollUntilVisible:
    element: "Credits & licences.*"
    direction: DOWN
- takeScreenshot: credits
