appId: com.oktayshakirov.fitness
name: M5 saved preferences after process restart
---
- openLink: fitness:///
- assertVisible: About recovery
- assertNotVisible: Get started
- tapOn: Profile
- assertVisible: Female model
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Female model
          checked: true
- assertVisible:
    text: lb
    selected: true
- assertVisible:
    text: Slow
    selected: true
- takeScreenshot: settings-persisted
