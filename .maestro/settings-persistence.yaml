appId: com.oktayshakirov.fitness
name: M5 saved preferences after process restart
---
- openLink: fitness:///
- scrollUntilVisible:
    element: About recovery
    direction: UP
- assertNotVisible: Get started
- tapOn: "Profile.*"
- scrollUntilVisible:
    element: Female model
    direction: UP
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: Female model
          checked: true
- assertVisible:
    text: lb
    selected: true
- assertVisible:
    text: Slow
    selected: true
- takeScreenshot: settings-persisted
