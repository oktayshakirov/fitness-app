name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.13+ for node:sqlite without a flag (used by the storage tests).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Catches import and Metro resolution errors the typechecker cannot see. JS only, no native build.
      - name: Bundle the app (Android, JavaScript only)
        run: npx expo export --platform android --output-dir dist-ci
        env:
          CI: "1"
