// The root Expo plugin has resolved the Kotlin version before this module configures.
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:" + rootProject.ext.kotlinVersion)
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def appConfig = new groovy.json.JsonSlurper().parse(file('../../app.json')).expo
android {
    namespace 'com.shadev.musclepal.wear'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId appConfig.android.package
        minSdk 30
        targetSdk rootProject.ext.targetSdkVersion
        versionName appConfig.android.version ?: appConfig.version
        versionCode 1000000 + appConfig.android.versionCode
    }
    signingConfigs {
        debug {
            storeFile new File(rootDir, 'app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        // Release intentionally unsigned. Use Android Studio's Generate Signed Bundle
        // with the existing phone upload key; never ship a debug-signed watch bundle.
        release { minifyEnabled false }
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.wear.compose:compose-foundation:1.5.0'
    implementation 'androidx.wear.compose:compose-material3:1.5.0'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'androidx.wear.tiles:tiles:1.5.0'
    implementation 'androidx.wear.protolayout:protolayout:1.3.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    implementation 'com.google.guava:guava:33.4.8-android'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
